name: Sync backend package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid using the automatically persisted credentials so we can
          # explicitly push via the provided GITHUB_TOKEN in the next step.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (update lock)
        run: |
          npm install

      - name: Commit lockfile if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "package-lock.json"; then
            git add package-lock.json
            git commit -m "chore(ci): sync backend package-lock.json [skip ci]"
            # Push using an explicit URL that embeds the GITHUB_TOKEN to ensure
            # authentication works even when repo settings require it.
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes to package-lock.json"
          fi
