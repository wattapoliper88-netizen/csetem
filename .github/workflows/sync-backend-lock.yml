name: Sync backend package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid using the automatically persisted credentials so we can
          # explicitly push via the provided GITHUB_TOKEN in the next step.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (update lock)
        run: |
          npm install

      - name: Create pull request if lockfile changed
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ci): sync backend package-lock.json [skip ci]"
          branch: "sync-backend-lock-${{ github.run_id }}"
          title: "chore(ci): sync backend package-lock.json [skip ci]"
          body: |
            This PR was created by the lock-sync workflow to keep `backend/package-lock.json` in sync with `backend/package.json`.
          labels: dependencies,ci
